name = "ArakelovGeometry"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ArakelovGeometry"]
requiresModuleSystem = true
# Bound each compiler process as well as Lake's own runtime pool.
weakLeanArgs = ["-j2"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[require]]
name = "HarderNarasimhan"
git = "https://github.com/YijunYuan/HarderNarasimhan"
rev = "14b3090e1e169b77fe381102a1289f24c2b08a11"

[[lean_lib]]
name = "ArakelovGeometry"

[[lean_lib]]
name = "ExternalResults"
